services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: planner_test
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner_test"]
      interval: 2s
      timeout: 5s
      retries: 20
